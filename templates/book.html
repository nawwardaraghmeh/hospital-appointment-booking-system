{{define "content"}}
<div class="card center-card">
    <h2>Book Appointment</h2>

    {{if .Errors}}
    <div class="alert alert-error">
        {{range .Errors}}<p>• {{.}}</p>{{end}}
    </div>
    {{end}}

    <form method="POST" class="form-stack">
        <input class="input" name="name" placeholder="Full Name" value="{{.Name}}" required>
        <input class="input" name="age" type="number" placeholder="Age" value="{{.Age}}" required>
        <input class="input" name="phone" placeholder="Phone" value="{{.Phone}}">
        <input class="input" name="email" type="email" placeholder="Email" value="{{.Email}}">
        <textarea class="input" name="symptoms" placeholder="Describe your symptoms" rows="4">{{.Symptoms}}</textarea>
        <button class="btn btn-primary btn-full" type="submit">Confirm Booking</button>
    </form>
    <a href="javascript:history.back()" class="link muted small">← Back to Slots</a>
</div>
{{end}}
