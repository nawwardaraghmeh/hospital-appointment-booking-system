<!DOCTYPE html>
<html>
<head>
    <title>HABS System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); }
        h2 { margin-bottom: 25px; color: #333; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 6px; background: #007bff; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        button.admin { background: #343a40; }
        hr { margin: 25px 0; border: 0; border-top: 1px solid #eee; }
        p { color: #666; font-size: 14px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Hospital Appointment Booking System</h2>
        <button onclick="location.href='/patient/login'">Patient Login</button>
        <button class="admin" onclick="location.href='/admin/login'">Admin Login</button>
        <hr>
        <p>New to the system?</p>
        <a href="/register">Create an Account</a>
    </div>
</body>
</html>
