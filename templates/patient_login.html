<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; width: 380px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { cursor: pointer; background: #4caf50; color: white; border: none; font-weight: bold; margin-top: 15px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Patient Login</h2>
        <form action="/do-login" method="POST">
            <input name="username" placeholder="Username (Email)" required>
            <input name="password" type="password" placeholder="Password" required>
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            <p style="font-size: 12px; color: #666; margin-bottom: 5px;">Select Department to see slots:</p>
            
            <select id="citySelect" required>
                <option value="">Select City</option>
                {{range .Cities}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
            </select>

            <select id="hospitalSelect" required>
                <option value="">Select Hospital</option>
                {{range .Hospitals}}<option value="{{.ID}}" data-city="{{.CityID}}">{{.Name}}</option>{{end}}
            </select>

            <select id="departmentSelect" name="department_id" required>
                <option value="">Select Department</option>
                {{range .Departments}}<option value="{{.ID}}" data-hospital="{{.HospitalID}}">{{.Name}}</option>{{end}}
            </select>

            <button type="submit">Login & See Available Slots</button>
        </form>
        <p><a href="/" style="color: #666; font-size: 13px; text-decoration: none;">Back to Home</a></p>
    </div>

    <script>
        document.getElementById("citySelect").addEventListener("change", function () {
            let city = this.value;
            document.querySelectorAll("#hospitalSelect option").forEach((opt) => {
                opt.style.display = opt.dataset.city === city || opt.value === "" ? "" : "none";
            });
            document.getElementById("hospitalSelect").value = "";
        });

        document.getElementById("hospitalSelect").addEventListener("change", function () {
            let hosp = this.value;
            document.querySelectorAll("#departmentSelect option").forEach((opt) => {
                opt.style.display = opt.dataset.hospital === hosp || opt.value === "" ? "" : "none";
            });
            document.getElementById("departmentSelect").value = "";
        });
    </script>
</body>
</html>
