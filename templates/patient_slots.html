<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Available Slots</title>
<style>
  body { font-family: Arial, sans-serif; padding: 30px; background: #eef2f7; }
  h2 { color: #333; }
  table { width: 80%; margin: auto; border-collapse: collapse; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background: #4CAF50; color: white; }
  a { padding: 5px 10px; background: #4CAF50; color: white; text-decoration: none; }
</style>
</head>
<body>
<h2>Available Slots</h2>
<table>
<tr><th>Doctor</th><th>Room</th><th>Time</th><th>Duration</th><th>Action</th></tr>
{{range .Slots}}
<tr>
  <td>{{.Doctor}}</td>
  <td>{{.Room}}</td>
  <td>{{.StartTime}}</td>
  <td>{{.Duration}}</td>
  <td><a href="/book?slot_id={{.ID}}">Book Appointment</a></td>
</tr>
{{else}}<tr><td colspan="5">No slots available</td></tr>{{end}}
</table>
<a href="/logout"><button>Logout</button></a>
</body>
</html>
