<!DOCTYPE html>
<html>
<head>
    <title>Register - HABS</title>
    <style>
        body { font-family: Arial; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }
        .admin-box { background: #f9f9f9; padding: 15px; border: 1px dashed #007bff; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <form action="/do-register" method="POST">
            <input name="username" placeholder="Username (Email)" required>
            <input name="password" type="password" placeholder="Password" required>
            <input name="full_name" placeholder="Full Name" required>
            
            <select name="role" id="roleSelect" onchange="toggleAdminFields()" required>
                <option value="patient">Patient</option>
                <option value="admin">Hospital Admin</option>
            </select>

            <div id="adminFields" class="admin-box" style="display:none;">
                <p style="margin:0 0 10px 0; color:#555;"><small>Admin Verification Required</small></p>
                <input name="admin_code" type="password" placeholder="Admin Secret Key">
                <select name="hospital_id">
                    <option value="">Select Your Hospital</option>
                    {{range .Hospitals}}<option value="{{.ID}}">{{.Name}}</option>{{end}}
                </select>
            </div>

            <button type="submit">Register</button>
        </form>
        <p><a href="/" style="color:#007bff; text-decoration:none; font-size:14px;">Back to Login</a></p>
    </div>

    <script>
        function toggleAdminFields() {
            const role = document.getElementById('roleSelect').value;
            document.getElementById('adminFields').style.display = (role === 'admin') ? 'block' : 'none';
        }
    </script>
</body>
</html>
