{{define "content"}}
<div class="card center-card">
    <h2>Create Patient Account</h2>

    {{if .Errors}}
    <div class="alert alert-error">
        {{range .Errors}}<p>• {{.}}</p>{{end}}
    </div>
    {{end}}

    <form action="/do-register" method="POST">
        <input class="input" name="username" placeholder="Username (Email)" required>
        <input class="input" name="password" type="password" placeholder="Password (min 6 chars)" required>
        <input class="input" name="full_name" placeholder="Full Name" required>
        <button class="btn btn-primary btn-full" type="submit">Register</button>
    </form>
    <p><a href="/login" class="link muted small">Already have an account? Login</a></p>
</div>
{{end}}
